sections:
  - id: research-interests
    title: "Research Interests"
    enabled: true
    body: >-
      My research has focused on using neuroimaging to study brain connectivity 
      and neuromodulation across epilepsy, Parkinson's disease, chronic pain, and 
      other neurological conditions. Through this work, I became increasingly 
      interested not only in whether an intervention produces a clinical effect, 
      but also in what neural activity and stimulation can reveal about individual 
      brain circuits and their relationships to cognition and behavior. <br><br>
      
      Going forward, I hope to integrate multimodal neuroimaging, computational 
      methods, neural recordings, and neuromodulation to study human brain function 
      from circuit-level mechanisms to behavior in real-world settings. Ultimately, 
      I am interested in using these insights both to better understand the human 
      brain and to develop more precise, individualized, and clinically meaningful 
      interventions.

