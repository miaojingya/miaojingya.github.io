sections:
  - id: research-interests
    title: "Research Interests"
    enabled: true
    body: >-
      My research has focused on using neuroimaging to study brain connectivity and neuromodulation 
      across epilepsy, Parkinson’s disease, chronic pain, and other neurological conditions. Through 
      this work, I became increasingly interested not only in whether an intervention produces a 
      clinical effect, but in how individual brain circuits and pathways shape cognition, behavior, 
      and treatment response. <br><br>
      
      Going forward, I hope to integrate multimodal neuroimaging, computational modeling and machine 
      learning, neural recordings, and neuromodulation to study these relationships at greater depth. 
      I am particularly interested in understanding how stimulation engages specific neural pathways 
      and in developing imaging- and circuit-based models that can move beyond characterizing observed 
      effects toward predicting individual outcomes. Ultimately, I hope to translate these insights 
      into more precise, individualized, and clinically meaningful interventions.

